[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational-chat-history"
version = "0.1.0"
description = "Durable per-user chat history for Flask applications hosted on Azure App Service."
requires-python = ">=3.10"
dependencies = [
  "azure-cosmos>=4.9.0,<5",
  "azure-identity>=1.17.0,<2",
  "Flask>=3.0.0,<4",
  "pydantic>=2.7.0,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["chat_history*"]